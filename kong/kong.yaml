ource\"\nlocal SCOPE_DENIED_HEAD = \"{\\\"code\\\":\\\"900910\\\",\\\"message\\\":\\\"The access token does not allow you to access the requested resource\\\",\\\"description\\\":\\\"User is NOT authorized to access the Resource: \"\nlocal SCOPE_DENIED_TAIL = \". Scope validation failed.\\\"}\"\n\n-- An error copies back every request header but these; a preflight leaves out only User-Agent and the\n-- connection's own.\nlocal NOT_COPIED = { host = true, [\"user-agent\"] = true, accept = true, authorization = true, date = true,\n  server = true, [\"content-type\"] = true, [\"www-authenticate\"] = true, [\"content-length\"] = true,\n  [\"transfer-encoding\"] = true, connection = true, [\"keep-alive\"] = true, expect = true, upgrade = true,\n  [\"proxy-connection\"] = true }\nlocal NOT_COPIED_PREFLIGHT = { [\"user-agent\"] = true, [\"content-length\"] = true,\n  [\"transfer-encoding\"] = true, connection = true, [\"keep-alive\"] = true, expect = true, upgrade = true,\n  [\"proxy-connection\"] = true }\n\nlocal function copy_request_headers(skip)\n  for name, value in pairs(ngx.req.get_headers(0, true)) do\n    if not skip[string.lower(name)] then\n      if type(value) == \"table\" then\n        kong.response.set_header(name, value[1])\n        for i = 2, #value do kong.response.add_header(name, value[i]) end\n      else\n        kong.response.set_header(name, value)\n      end\n    end\n  end\nend\n\nlocal function add_if_missing(name, value)\n  if kong.response.get_header(name) == nil then kong.response.set_header(name, value) end\nend\n\nlocal function cors()\n  local origin = \"*\"\n  if not CORS.any_origin then\n    local o = kong.request.get_header(\"Origin\")\n    origin = (o and CORS.origins[o]) and o or \" \"\n  end\n  add_if_missing(\"Access-Control-Allow-Origin\", origin)\n  add_if_missing(\"Access-Control-Allow-Methods\", CORS.methods)\n  add_if_missing(\"Access-Control-Allow-Headers\", CORS.headers)\n  if CORS.credentials then add_if_missing(\"Access-Contr